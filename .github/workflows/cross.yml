on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  build:
    name: rv64_emu built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: x86_64-linux, os: ubuntu-latest}
          - {system: aarch64-linux, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check # Runs the test programs under qemu-riscv64
      - run: |
          nix build
          tar -cf rv64_emu-built-on-${{ matrix.system }}.tar -C result . # Tar keeps the modes that artifacts lose
          mkdir run # Store paths that it needs, and the check, for the run below on a runner without Nix
          readlink -f result > run/path.txt
          nix-store -qR result | tar -cf run/closure.tar -T -
          cp flake/agree.sh run
      - uses: actions/upload-artifact@main
        with:
          path: rv64_emu-built-on-${{ matrix.system }}.tar
          archive: false
      - uses: actions/upload-artifact@main
        with:
          name: run-built-on-${{ matrix.system }}
          path: run
          retention-days: 1
  run:
    name: rv64_emu built on ${{ matrix.system }}, run on riscv64-linux
    needs: build
    if: ${{ !cancelled() }} # Builds that succeeded still run when another failed
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/download-artifact@main
        with:
          name: run-built-on-${{ matrix.system }}
      - run: |
          sudo tar -xf closure.tar -C /
          sh agree.sh "$(cat path.txt)/bin/rv64_emu"
